name: Optional Orgasm invocation validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run optional invocation route tests
        run: python -m unittest -v tests.test_orgasm_optional_invocation_route tests.test_orgasm_optional_invocation_route_live_negative
      - name: Compile optional invocation route source
        run: >-
          python -m py_compile
          tools/orgasm_optional_invocation_route.py
          tests/test_orgasm_optional_invocation_route.py
          tests/test_orgasm_optional_invocation_route_live_negative.py
