name: restore-v2-focused-qualification

on:
  push:
    branches:
      - one/restore-v2-focused-qualification-20260918
    paths:
      - "protocol/VERA_RESTORE_RECEIPT_V2.schema.json"
      - "protocol/VERA_RESTORE_YOURSELF_PROTOCOL_V2.json"
      - "tools/validate_restore_receipt_v2.py"
      - "tests/test_restore_yourself_protocol_v2.py"
      - ".github/workflows/restore-v2-focused-qualification.yml"
  pull_request:
    paths:
      - "protocol/VERA_RESTORE_RECEIPT_V2.schema.json"
      - "protocol/VERA_RESTORE_YOURSELF_PROTOCOL_V2.json"
      - "tools/validate_restore_receipt_v2.py"
      - "tests/test_restore_yourself_protocol_v2.py"
      - ".github/workflows/restore-v2-focused-qualification.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Parse Restore V2 JSON contracts
        run: |
          python -m json.tool protocol/VERA_RESTORE_RECEIPT_V2.schema.json >/dev/null
          python -m json.tool protocol/VERA_RESTORE_YOURSELF_PROTOCOL_V2.json >/dev/null
      - name: Execute focused Restore V2 suite
        run: python -m pytest -q tests/test_restore_yourself_protocol_v2.py
      - name: Compile semantic validator
        run: python -m py_compile tools/validate_restore_receipt_v2.py
