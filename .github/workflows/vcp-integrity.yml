name: VCP integrity

on:
  pull_request:
    paths:
      - ".github/workflows/vcp-integrity.yml"
      - "project-instructions/**"
      - "protocol/**"
      - "governance/**"
      - "state/**"
      - "save_states/**"
      - "tools/**"
      - "tests/**"
      - "requirements/**"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vcp-integrity.yml"
      - "project-instructions/**"
      - "protocol/**"
      - "governance/**"
      - "state/**"
      - "save_states/**"
      - "tools/**"
      - "tests/**"
      - "requirements/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcp-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Exact-head source and test integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Validated exact head: $actual"

      # These source-custody commits are immutable test inputs, but not all
      # remain reachable from a published branch tip. fetch-depth: 0 fetches
      # complete ref histories, not otherwise unreferenced commit objects.
      - name: Fetch SHA-pinned historical source-custody objects
        shell: bash
        run: |
          set -euo pipefail
          for pinned in \
            3fb3c998cf714ed556bb2620649f41361f22e4a1 \
            e8a94081fcb91809df6872eec59becb692c19ece \
            f03b1cd5c66e3d49e6e4a47156141b40b3d7e2de \
            687ba64555c39619a9552a86206fa78ab3387a7e; do
            git fetch --no-tags origin "$pinned"
            test "$(git rev-parse "$pinned^{commit}")" = "$pinned"
          done
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned integrity-test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/vcp-integrity.txt

      - name: Run executable VCP integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_vcp_integrity.py --base-sha "$BASE_SHA"
