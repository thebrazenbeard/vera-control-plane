name: VCP integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/vcp-integrity.yml"
      - "project-instructions/**"
      - "protocol/**"
      - "governance/**"
      - "state/**"
      - "save_states/**"
      - "tools/**"
      - "tests/**"
      - "requirements/**"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vcp-integrity.yml"
      - "project-instructions/**"
      - "protocol/**"
      - "governance/**"
      - "state/**"
      - "save_states/**"
      - "tools/**"
      - "tests/**"
      - "requirements/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcp-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Exact-head source and test integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Validated exact head: $actual"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned integrity-test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/vcp-integrity.txt

      - name: Run executable VCP integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_vcp_integrity.py --base-sha "$BASE_SHA"
